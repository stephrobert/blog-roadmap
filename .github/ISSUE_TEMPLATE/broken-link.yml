name: Lien cassé / Broken link
description: "Un lien interne ou externe ne répond plus / An internal or external link no longer answers."
title: "[Lien] "
labels: ["type:broken-link"]
body:
  - type: input
    id: page-title
    attributes:
      label: Page concernée / Page
      description: Rempli automatiquement depuis le site. Filled in automatically from the site.
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Page qui contient le lien / Page URL
      placeholder: "https://blog.stephane-robert.info/docs/..."
    validations:
      required: true

  - type: input
    id: lien-casse
    attributes:
      label: Lien cassé / Broken link
      description: L'adresse telle qu'elle est écrite dans la page. The address as written in the page.
    validations:
      required: true

  - type: dropdown
    id: symptome
    attributes:
      label: Ce que répond le lien / What the link answers
      options:
        - "404, la page n'existe pas / 404, the page does not exist"
        - "Le domaine ne répond plus / The domain no longer answers"
        - "Redirection vers une page sans rapport / Redirects to an unrelated page"
        - "Contenu déplacé, l'adresse a changé / Content moved, the address changed"
        - "Autre / Other"
      default: 0
    validations:
      required: true

  - type: input
    id: remplacement
    attributes:
      label: Adresse de remplacement / Replacement address
      description: Si vous avez retrouvé la page ailleurs. Facultatif, mais c'est ce qui permet de corriger sans enquêter. If you found the page elsewhere. Optional.

  - type: dropdown
    id: locale
    attributes:
      label: Langue de la page / Page language
      options:
        - fr
        - en
      default: 0
    validations:
      required: true

  - type: input
    id: page-id
    attributes:
      label: Identifiant de page / Page id
      description: Rempli automatiquement, à ne pas modifier. Il survit à un changement d'URL. Filled in automatically, do not edit.
