name: Autre / Other
description: "Ce qui n'entre dans aucune des catégories précédentes / Anything that fits none of the other forms."
title: "[Autre] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Ce formulaire est volontairement le dernier de la liste. Une issue rangée
        dans la bonne catégorie avance plus vite, alors regardez d'abord si l'un
        des cinq autres convient.

        *This form is last on purpose. An issue filed in the right category moves
        faster, so check first whether one of the other five fits. Answer in
        English if you prefer.*

  - type: textarea
    id: sujet
    attributes:
      label: De quoi s'agit-il / What is it about
      description: Décrivez le plus précisément possible, et donnez une URL si une page est concernée. Be as precise as possible, and give a URL if a page is involved.
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: URL concernée / URL involved
      description: Facultatif, mais une issue sans URL demande presque toujours un aller-retour. Optional, but an issue without a URL almost always needs a follow-up question.
      placeholder: "https://blog.stephane-robert.info/..."
