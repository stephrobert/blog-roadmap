name: Erreur dans une page
description: Une commande fausse, une explication inexacte, une sortie qui ne correspond pas.
title: "[Page] "
labels: ["type:content-error"]
body:
  - type: markdown
    attributes:
      value: |
        Les deux premiers champs sont remplis automatiquement si vous arrivez
        depuis le bouton **« Signaler un problème »** d'une page du site.

  - type: input
    id: page-title
    attributes:
      label: Page concernée
      description: Le titre de la page, tel qu'il s'affiche.
      placeholder: "Kubernetes : Network Policies"
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: URL
      description: L'adresse complète de la page. C'est la seule information sans laquelle l'issue ne peut pas être traitée.
      placeholder: "https://blog.stephane-robert.info/docs/..."
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Section
      description: Le titre du chapitre concerné, ou l'ancre. Facultatif, mais il fait gagner une relecture entière sur un guide long.
      placeholder: "Isoler un namespace"

  - type: textarea
    id: probleme
    attributes:
      label: Ce que vous avez constaté
      description: |
        Le fait, pas l'impression. Une commande et son message d'erreur, une valeur
        qui ne correspond pas à ce que rend l'outil, une étape qui manque.
      placeholder: |
        La commande `kubectl ...` de la section « ... » répond :

            Error: ...
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous attendiez
      description: Ce que la page aurait dû dire, ou ce que l'outil rend réellement chez vous.

  - type: textarea
    id: complement
    attributes:
      label: Informations complémentaires
      description: Version de l'outil, système, contexte. Tout ce qui permet de reproduire.

  - type: dropdown
    id: locale
    attributes:
      label: Langue de la page
      options:
        - fr
        - en
      default: 0
    validations:
      required: true
