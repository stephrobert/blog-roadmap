name: Erreur dans une page / Page error
description: "Une commande fausse, une explication inexacte / A wrong command or an inaccurate explanation."
title: "[Page] "
labels: ["type:content-error"]
body:
  - type: markdown
    attributes:
      value: |
        Les deux premiers champs sont remplis automatiquement si vous arrivez
        depuis le bouton **« Signaler un problème »** d'une page du site.

        *The first two fields are filled in automatically when you come from the
        report button of a page. Answer in English if you prefer.*

  - type: input
    id: page-title
    attributes:
      label: Page concernée / Page
      description: Le titre de la page, tel qu'il s'affiche. The page title as displayed.
      placeholder: "Kubernetes : Network Policies"
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: URL
      description: L'adresse complète de la page, seule information sans laquelle l'issue ne peut pas être traitée. The full page address.
      placeholder: "https://blog.stephane-robert.info/docs/..."
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Section
      description: Le titre du chapitre concerné, ou l'ancre. Facultatif. The heading or anchor concerned. Optional.
      placeholder: "Isoler un namespace"

  - type: textarea
    id: probleme
    attributes:
      label: Ce que vous avez constaté / What you found
      description: |
        Le fait, pas l'impression. Une commande et son message d'erreur, une valeur
        qui ne correspond pas à ce que rend l'outil, une étape qui manque.
      placeholder: |
        La commande `kubectl ...` de la section « ... » répond :

            Error: ...
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous attendiez / What you expected
      description: Ce que la page aurait dû dire, ou ce que l'outil rend chez vous. What the page should have said.

  - type: textarea
    id: complement
    attributes:
      label: Informations complémentaires / Anything else
      description: Version de l'outil, système, contexte. Tout ce qui permet de reproduire. Anything that helps reproduce.

  - type: dropdown
    id: locale
    attributes:
      label: Langue de la page / Page language
      options:
        - fr
        - en
      default: 0
    validations:
      required: true

  - type: input
    id: page-id
    attributes:
      label: Identifiant de page / Page id
      description: Rempli automatiquement, à ne pas modifier. Il survit à un changement d'URL. Filled in automatically, do not edit.
