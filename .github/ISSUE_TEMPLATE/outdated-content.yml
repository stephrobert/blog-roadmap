name: Contenu obsolète / Outdated content
description: "Une version dépassée, un comportement qui a changé / An outdated version or changed behaviour."
title: "[Obsolète] "
labels: ["type:outdated"]
body:
  - type: markdown
    attributes:
      value: |
        Ce formulaire demande une **source**. C'est ce qui sépare un signalement
        traitable d'une recherche à refaire entièrement avant de pouvoir agir.

        *This form asks for a **source**. Without it, the whole check has to be
        redone before anything can be fixed. Answer in English if you prefer.*

  - type: input
    id: page-title
    attributes:
      label: Page concernée / Page
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: URL
      placeholder: "https://blog.stephane-robert.info/docs/..."
    validations:
      required: true

  - type: input
    id: technologie
    attributes:
      label: Technologie concernée / Technology
      placeholder: "Kubernetes, Terraform, Ansible, Trivy..."
    validations:
      required: true

  - type: input
    id: version-page
    attributes:
      label: Version présentée par la page / Version shown
      placeholder: "1.31"

  - type: input
    id: version-actuelle
    attributes:
      label: Version actuelle / Current version
      placeholder: "1.37"

  - type: textarea
    id: obsolete
    attributes:
      label: Ce qui est devenu faux / What is now wrong
      description: |
        Le point précis, pas « la page est vieille ». Une option retirée, un champ
        renommé, une commande qui ne répond plus la même chose, une pratique qui
        n'est plus recommandée.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source
      description: "Changelog, note de version, documentation officielle. Fortement recommandée, car sans elle la vérification est à refaire entièrement. Strongly recommended."
      placeholder: "https://kubernetes.io/blog/..."

  - type: dropdown
    id: locale
    attributes:
      label: Langue de la page / Page language
      options:
        - fr
        - en
      default: 0
    validations:
      required: true

  - type: input
    id: page-id
    attributes:
      label: Identifiant de page / Page id
      description: Rempli automatiquement, à ne pas modifier. Il survit à un changement d'URL. Filled in automatically, do not edit.
