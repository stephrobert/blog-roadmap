# Confronte `.github/discussions.yml` a ce que le depot porte reellement.
#
# POURQUOI CE CONTROLE EXISTE
#
# Les categories ne se creent pas par API : verifie, GraphQL n'expose aucune
# mutation qui en cree, en renomme ou en supprime une, et l'API REST rend 404
# meme en lecture. Le seul `categoryId` mutable est celui d'`updateDiscussion`,
# qui deplace une discussion sans toucher a la categorie. Elles sont donc
# posees a la main une fois, et tout ce qui est pose a la main derive. Une
# categorie renommee, supprimee, ou passee en Q&A par erreur ne produit aucun
# signal : elle se decouvre des mois plus tard, sur une discussion mal rangee.
#
# Ce workflow ne corrige rien, il MESURE. C'est la seule chose qu'on puisse
# faire sans mutation, et c'est deja ce qui manque le plus.
#
# Il verifie aussi que chaque categorie a formulaire porte un fichier
# `DISCUSSION_TEMPLATE/<slug>.yml`, parce que GitHub apparie le gabarit a la
# categorie PAR LE NOM DU FICHIER. Un slug mal devine ne produit aucune erreur :
# le formulaire n'est simplement jamais propose.
name: Catégories de discussion

on:
  schedule:
    # Hebdomadaire : une derive de categorie n'est pas urgente, et un controle
    # quotidien sur une chose qui bouge deux fois par an est du bruit.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/discussions.yml'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/workflows/categories-discussions.yml'

permissions: {}

jobs:
  comparer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Relever les catégories réelles
        env:
          GH_TOKEN: ${{ github.token }}
          # Le nom du dépôt passe par l'environnement plutôt que par une
          # expansion de gabarit dans le script : une expansion se substitue
          # AVANT que le shell ne lise la ligne, et devient donc du code.
          PROPRIETAIRE: ${{ github.repository_owner }}
          NOM_DEPOT: ${{ github.event.repository.name }}
        run: |
          # $o et $r sont des variables GraphQL, pas des variables shell : elles
          # doivent parvenir telles quelles a l'API.
          # shellcheck disable=SC2016
          gh api graphql -f query='
            query($o: String!, $r: String!) {
              repository(owner: $o, name: $r) {
                discussionCategories(first: 50) {
                  nodes { name slug emoji isAnswerable }
                }
              }
            }' -F o="$PROPRIETAIRE" -F r="$NOM_DEPOT" \
            --jq '.data.repository.discussionCategories.nodes' > /tmp/reelles.json
          cat /tmp/reelles.json

      - name: Comparer à la déclaration
        run: |
          # PyYAML est present sur l'image du runner, mais rien ne le garantit
          # dans la duree : le controle porte sur une derive, il ne doit pas
          # echouer pour une dependance absente.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          import yaml

          decl = yaml.safe_load(Path(".github/discussions.yml").read_text(encoding="utf-8"))
          reelles = json.loads(Path("/tmp/reelles.json").read_text(encoding="utf-8"))
          par_slug = {c["slug"]: c for c in reelles}

          # `type` declare -> ce que l'API rend. Seul Q&A est distinguable par
          # l'API : `isAnswerable`. Le format « annonce » n'est pas expose, il
          # n'est donc pas controle plutot que controle a moitie.
          ecarts, notes = [], []

          for c in decl["categories"]:
              slug, nom, attendu = c["slug"], c["name"], c["type"]
              vue = par_slug.get(slug)
              if not vue:
                  proches = [s for s in par_slug if s.startswith(slug[:6])]
                  indice = f", slug proche : {proches}" if proches else ""
                  ecarts.append(f"{slug} : declaree, absente du depot{indice}")
                  continue
              if vue["name"] != nom:
                  ecarts.append(f"{slug} : nom {vue['name']!r}, declare {nom!r}")
              # L'API rend le shortcode (« :bulb: »), jamais le caractere.
              if vue["emoji"] != c["emoji"]:
                  ecarts.append(f"{slug} : emoji {vue['emoji']}, declare {c['emoji']}")
              if attendu == "question" and not vue["isAnswerable"]:
                  ecarts.append(f"{slug} : declaree en Q&A, ne l'est pas")
              if attendu != "question" and vue["isAnswerable"]:
                  ecarts.append(f"{slug} : en Q&A alors qu'elle est declaree {attendu}")

          for slug in decl.get("supprimer", []):
              if slug in par_slug:
                  ecarts.append(f"{slug} : declaree a supprimer, toujours presente")

          # Le gabarit s'apparie PAR LE NOM DU FICHIER. Un slug mal devine ne
          # produit aucune erreur cote GitHub, le formulaire n'apparait pas.
          gabarits = {f.stem for f in Path(".github/DISCUSSION_TEMPLATE").glob("*.yml")} \
              if Path(".github/DISCUSSION_TEMPLATE").is_dir() else set()
          attendus = {c["slug"] for c in decl["categories"] if c["type"] != "announcement"}
          for manquant in sorted(attendus - gabarits):
              notes.append(f"{manquant} : aucun DISCUSSION_TEMPLATE/{manquant}.yml")
          for orphelin in sorted(gabarits - {c["slug"] for c in decl["categories"]}):
              ecarts.append(f"DISCUSSION_TEMPLATE/{orphelin}.yml : aucune categorie de ce slug")

          if notes:
              print("Remarques :")
              for n in notes:
                  print(f"  {n}")

          if ecarts:
              print("\nDerive entre la declaration et le depot :")
              for e in ecarts:
                  print(f"  {e}")
              print("\nSlugs reellement presents :")
              for s in sorted(par_slug):
                  print(f"  {s}")
              print("\nLes categories ne se creent pas par API : corriger dans"
                    " l'interface, ou aligner .github/discussions.yml.")
              sys.exit(1)

          print(f"Conforme : {len(decl['categories'])} categories declarees, toutes presentes"
                " et dans le bon format.")
          PY
