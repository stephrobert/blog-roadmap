# Pose les labels que l'URL et l'origine d'une issue permettent de DEDUIRE.
#
# Ce workflow ne prend aucune decision editoriale : il ne priorise pas, ne ferme
# rien, ne reclasse aucun type. Il pose deux choses qu'un humain retaperait a
# l'identique a chaque fois, l'origine du signalement et le domaine du site
# concerne, et il s'arrete la. Le tri, lui, reste manuel et c'est voulu.
name: Triage automatique

on:
  issues:
    types: [opened, edited]

# Le jeton par defaut ne peut qu'ecrire des labels sur des issues. Rien d'autre.
permissions: {}

jobs:
  etiqueter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Les regles vivent dans .github/triage/deduire.js, testees a chaque PR
      # (tests-triage.yml). Le checkout est celui de la branche par defaut :
      # une issue ne peut pas faire executer le code d'une PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/triage

      - name: Déduire l'origine et le domaine
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { deduire } = require(`${process.env.GITHUB_WORKSPACE}/.github/triage/deduire.js`);
            // Une issue automatisee (source:automated, ou marqueur coverage-key)
            // ne recoit rien : son domaine est pose par l'outil qui l'ecrit.
            const aPoser = deduire(context.payload.issue.body, context.payload.issue.labels.map((l) => l.name));
            if (aPoser.length === 0) {
              core.info("Rien a poser : rien a deduire, issue automatisee, ou labels deja poses.");
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: aPoser,
            });
            core.info(`Poses : ${aPoser.join(", ")}`);
