# Les categories de Discussions, declarees.
#
# CE FICHIER NE CREE RIEN. Aucune mutation GraphQL publique ne cree, ne renomme
# ni ne supprime une categorie de discussion, et l'API REST n'a pas d'endpoint :
# verifie en interrogeant le schema, et en recevant un 404 meme en lecture. La
# seule mutation qui mentionne une categorie est `updateDiscussion`, dont le
# `categoryId` DEPLACE une discussion d'une categorie a l'autre sans toucher a
# la categorie elle-meme. La creation se fait une fois dans l'interface,
# `Discussions` puis `Categories`.
#
# Ce fichier documente l'etat vise. Il a existe un controle de derive qui le
# comparait au depot a chaque semaine ; il a ete retire, ce qui veut dire qu'une
# categorie renommee ou supprimee ne produit plus aucun signal. La verification
# se refait a la demande, en une requete :
#
#   gh api graphql -f query='
#     query { repository(owner: "stephrobert", name: "blog-roadmap") {
#       discussionCategories(first: 50) { nodes { name slug emoji isAnswerable } } } }' \
#     --jq '.data.repository.discussionCategories.nodes[] | "\(.slug)\t\(.name)"'
#
# LE SLUG NE SE DEVINE PAS, IL SE MESURE. Fabrique relevee sur les cinq
# categories reelles le 2026-09-17 : minuscules, espaces / `&` / apostrophe
# remplaces par `-`, separateurs consecutifs fusionnes, et surtout les ACCENTS
# CONSERVES. `Idées & suggestions` donne `idées-suggestions`, et
# `Retours d'expérience` donne `retours-d-expérience`.
#
# La premiere version de ce fichier pariait sur une translitteration, et le
# controle a rendu les trois ecarts au premier passage. C'est exactement ce
# qu'il est la pour faire : le depot tranche, pas ce fichier.
#
# L'enjeu n'est pas cosmetique. GitHub apparie le gabarit de
# `DISCUSSION_TEMPLATE/` a sa categorie PAR LE NOM DU FICHIER : sur un slug
# faux, aucune erreur n'est levee, le formulaire n'est simplement jamais
# propose. Renommer une categorie impose donc de renommer son gabarit.
#
# `emoji` porte le shortcode rendu par l'API, pas le caractere : c'est sous
# cette forme que la comparaison se fait.

schema_version: 1

categories:
  - slug: idées-suggestions
    name: "Idées & suggestions"
    emoji: ":bulb:"
    type: open-ended
    raison: >-
      Proposer une idee avant qu'elle devienne une issue. C'est la categorie qui
      protege le backlog : « une formation eBPF aurait-elle un interet » n'est
      pas une tache.

  - slug: formations-pédagogie
    name: "Formations & pédagogie"
    emoji: ":student:"
    type: open-ended
    raison: >-
      Enchainement, niveau, TP, quiz, sujets manquants. Ce qui se discute sur la
      forme d'une formation plutot que sur un defaut de page.

  - slug: questions
    name: "Questions"
    emoji: ":question:"
    type: question
    raison: >-
      Questions sur le CONTENU d'une page. Une demande d'aide sur son propre
      probleme technique part sur Discord, sans quoi cette categorie devient un
      Stack Overflow personnel.

  - slug: retours-d-expérience
    name: "Retours d'expérience"
    emoji: ":microscope:"
    type: open-ended
    raison: >-
      « J'ai suivi ce guide avec Kubernetes 1.37 et… ». Ce signal vaut beaucoup
      plus qu'un pouce en haut ou en bas, et c'est le seul qui dise ce qui a
      manque a quelqu'un qui est alle au bout.

  - slug: annonces
    name: "Annonces"
    emoji: ":mega:"
    type: announcement
    raison: >-
      Nouvelles formations, refontes, roadmap. Ecriture reservee, commentaires
      ouverts.

# Volontairement ABSENT : une categorie par technologie. Kubernetes, Linux,
# Ansible et les autres deviendraient ingerables en quelques mois avec un corpus
# de cette taille. Le domaine appartient aux labels des issues, pas a la
# structure communautaire.
#
# Absent aussi : les sections de categories, que GitHub propose desormais. A
# cinq categories, regrouper n'aide personne.
supprimer:
  - polls
